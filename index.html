<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florencia Yofre — Repositorios</title>
<meta name="description" content="Vitrina de repositorios de Florencia Yofre en GitHub">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div class="brand">
      <span class="mono logo">FY // REPOS</span>
      <span class="mono sub">auto-actualizado desde GitHub API</span>
    </div>
    <div class="top-actions">
      <input id="search" class="input" placeholder="Buscar repo..." />
      <select id="langFilter" class="input"><option value="">Todos los lenguajes</option></select>
      <select id="sortBy" class="input"><option value="updated">Más recientes</option><option value="stars">Más estrellas</option><option value="name">A-Z</option></select>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="profile" class="profile">
    <!-- se rellena con JS -->
    <div class="skeleton">Cargando perfil...</div>
  </section>

  <section class="controls">
    <label class="check"><input type="checkbox" id="hideForks" checked> Ocultar forks</label>
    <label class="check"><input type="checkbox" id="hideArchived" checked> Ocultar archivados</label>
    <span id="counter" class="mono counter"></span>
  </section>

  <section id="grid" class="grid"></section>

  <section id="empty" class="empty hidden">
    <p>No se encontraron repos con esos filtros.</p>
  </section>
</main>

<footer class="wrap foot mono">
  <span>Hecho con GitHub API — se actualiza sola cada vez que creas o editas un repo</span>
  <span>© <span id="year"></span> Florencia Yofre</span>
</footer>

<script src="script.js"></script>
</body>
</html>
